
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Kashmir Tour Package Ertiga - Private Ertiga taxi with driver for Kashmir sightseeing, tours, airport transfers and Jammu pickup.">

<title>Kashmir Tour Package Ertiga | Private Taxi & Kashmir Tours</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Georgia,serif;
  background:#f7f6ef;
  color:#10251e;
  line-height:1.6;
}

img{
  display:block;
  width:100%;
  object-fit:cover;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* NAVBAR */

.navbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#062b21;
  color:white;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.nav-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  font-size:21px;
  font-weight:bold;
  letter-spacing:.3px;
}

.logo span{
  color:#d9ae4b;
}

.nav-links{
  display:flex;
  gap:24px;
  align-items:center;
  font-size:14px;
}

.nav-links a{
  transition:.2s;
}

.nav-links a:hover{
  color:#d9ae4b;
}

.nav-book{
  border:1px solid #d9ae4b;
  padding:10px 18px;
  border-radius:25px;
  color:white;
}

/* HERO */

.hero{
  min-height:650px;
  position:relative;
  background:
    linear-gradient(rgba(3,30,23,.58),rgba(3,30,23,.68)),
    url("ertiga_banner.png") center/cover no-repeat;
  display:flex;
  align-items:center;
  color:white;
}

.hero-content{
  max-width:720px;
  padding:80px 0;
}

.eyebrow{
  color:#e0bd68;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(46px,7vw,78px);
  line-height:.98;
  margin-bottom:25px;
}

.hero-text{
  font-size:18px;
  max-width:650px;
  color:#f2f2ed;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:14px 24px;
  border-radius:30px;
  font-weight:bold;
  border:1px solid transparent;
  cursor:pointer;
}

.btn-primary{
  background:#d9ae4b;
  color:#17251e;
}

.btn-outline{
  border-color:white;
  color:white;
}

.hero-trust{
  display:flex;
  flex-wrap:wrap;
  gap:25px;
  margin-top:28px;
  font-size:14px;
}

/* SECTION */

.section{
  padding:90px 0;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:50px;
  margin-bottom:45px;
}

.section-heading h2{
  font-size:clamp(35px,5vw,55px);
  line-height:1.05;
}

.section-heading p{
  max-width:480px;
  color:#68736c;
}

/* SERVICES */

.intro{
  background:#f7f6ef;
}

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.feature{
  background:white;
  border:1px solid #e1e3dc;
  border-radius:18px;
  padding:28px;
  box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.feature-icon{
  font-size:25px;
  color:#b58b2e;
  margin-bottom:12px;
}

.feature h3{
  margin-bottom:9px;
}

.feature p{
  color:#68736b;
  font-size:15px;
}

/* DESTINATIONS */

.destinations{
  background:#eaf0ea;
}

.destination-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.destination{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
  transition:.25s;
}

.destination:hover{
  transform:translateY(-6px);
}

.destination img{
  height:230px;
}

.destination-content{
  padding:22px;
}

.destination h3{
  font-size:25px;
  margin-bottom:8px;
}

.destination p{
  color:#68716c;
}

/* PACKAGES */

.packages{
  background:#f7f6ef;
}

.package-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.package-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #e0e2dc;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.package-card img{
  height:250px;
}

.package-content{
  padding:26px;
}

.package-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:15px;
}

.package-top h3{
  font-size:28px;
}

.days{
  background:#eaf0ea;
  color:#14513e;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.package-content ul{
  padding-left:20px;
  margin:15px 0 22px;
  color:#5f6963;
}

.package-content li{
  margin:5px 0;
}

.package-button{
  display:inline-block;
  background:#062b21;
  color:white;
  padding:12px 20px;
  border-radius:25px;
}

/* RATES */

.rates{
  background:#eaf0ea;
}

.rate-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.rate-card{
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
  border:1px solid #dfe4dc;
}

.rate-card h3{
  font-size:28px;
  margin-bottom:20px;
}

.rate-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 0;
  border-bottom:1px solid #e5e7e2;
}

.rate-row:last-child{
  border-bottom:0;
}

.rate-label{
  color:#68736c;
}

.rate-price{
  font-size:22px;
  font-weight:bold;
  color:#14513e;
}

.rate-note{
  margin-top:20px;
  color:#68736c;
  font-size:14px;
}

/* CAR */

.car-section{
  background:#f7f6ef;
}

.car-gallery{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:15px;
}

.car-gallery figure{
  overflow:hidden;
  border-radius:18px;
}

.car-gallery img{
  height:230px;
  transition:.3s;
}

.car-gallery img:hover{
  transform:scale(1.03);
}

.car-gallery .large{
  grid-row:span 2;
}

.car-gallery .large img{
  height:475px;
}

/* BOOKING */

.booking{
  background:#062b21;
  color:white;
}

.booking-wrapper{
  display:grid;
  grid-template-columns:1fr 450px;
  gap:70px;
  align-items:center;
}

.booking h2{
  font-size:clamp(40px,5vw,65px);
  line-height:1;
  margin-bottom:20px;
}

.booking-text{
  color:#d5dfd9;
  max-width:600px;
  font-size:17px;
}

.booking-card{
  background:white;
  color:#10251e;
  border-radius:22px;
  padding:30px;
}

.booking-card h3{
  font-size:28px;
  margin-bottom:22px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:14px;
  border:1px solid #d8ddd8;
  border-radius:10px;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:#b58b2e;
}

.form-group textarea{
  min-height:125px;
  resize:vertical;
}

.whatsapp-btn{
  width:100%;
  border:0;
  background:#d9ae4b;
  color:#17251e;
  font-family:inherit;
  font-size:15px;
  font-weight:bold;
  padding:15px;
  border-radius:30px;
  cursor:pointer;
}

.form-note{
  margin-top:12px;
  color:#68736c;
  font-size:12px;
}

/* FOOTER */

footer{
  background:#041e17;
  color:#cbd8d1;
  padding:35px 0;
  text-align:center;
}

footer strong{
  color:white;
  font-size:16px;
}

footer small{
  display:block;
  margin-top:8px;
}

/* MOBILE */

@media(max-width:900px){

  .nav-inner{
    min-height:65px;
  }

  .nav-links{
    gap:12px;
    font-size:12px;
  }

  .features{
    grid-template-columns:repeat(2,1fr);
  }

  .destination-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .package-grid{
    grid-template-columns:1fr;
  }

  .rate-grid{
    grid-template-columns:1fr;
  }

  .booking-wrapper{
    grid-template-columns:1fr;
    gap:40px;
  }
}

@media(max-width:600px){

  .container{
    width:90%;
  }

  .nav-links a:not(.nav-book){
    display:none;
  }

  .logo{
    font-size:17px;
  }

  .hero{
    min-height:650px;
  }

  .hero-content{
    padding:60px 0;
  }

  .hero h1{
    font-size:48px;
  }

  .hero-text{
    font-size:16px;
  }

  .section{
    padding:65px 0;
  }

  .section-heading{
    display:block;
  }

  .section-heading p{
    margin-top:20px;
  }

  .features{
    grid-template-columns:1fr;
  }

  .destination-grid{
    grid-template-columns:1fr;
  }

  .destination img{
    height:240px;
  }

  .car-gallery{
    grid-template-columns:1fr 1fr;
  }

  .car-gallery .large{
    grid-column:span 2;
    grid-row:auto;
  }

  .car-gallery .large img{
    height:280px;
  }

  .car-gallery img{
    height:180px;
  }

  .booking-card{
    padding:22px;
  }
}
</style>
</head>

<body>

<header class="navbar">
  <div class="container nav-inner">

    <a href="#home" class="logo">
      Kashmir Tour Package <span>Ertiga</span>
    </a>

    <nav class="nav-links">
      <a href="#services">Services</a>
      <a href="#destinations">Destinations</a>
      <a href="#packages">Packages</a>
      <a href="#rates">Rates</a>
      <a href="#car">Our Ertiga</a>
      <a href="#booking" class="nav-book">Book Now</a>
    </nav>

  </div>
</header>

<section
